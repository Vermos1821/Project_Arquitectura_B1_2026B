name: Generar y Publicar Javadoc
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Generar Javadoc
        run: javadoc -private -encoding UTF-8 -charset UTF-8 -docencoding UTF-8 -d docs_web $(find src/main/java -name "*.java")
      - name: Subir artefacto a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_web
      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
